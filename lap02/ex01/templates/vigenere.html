<!DOCTYPE html>
<html lang="en">
<head>
    <title>Vigenere Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-4">
        <a href="/" class="btn btn-secondary mb-3">Về trang chủ</a>
        <table class="table table-bordered">
            <tr><td style="text-align: center; font-weight: bold; font-size: 25px;">VIGENERE CIPHER</td></tr>
            <tr><td style="font-weight: bold; color: blue">ENCRYPTION</td></tr>
            <tr>
                <td>
                    <form method="POST" action="/vigenere_encrypt">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text" class="form-control" name="inputPlainText" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key (Text):</label>
                            <input type="text" class="form-control" name="inputKeyPlain" required/>
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                        
                        {% if enc_result %}
                        <div class="alert alert-info mt-3">
                            <b>Text:</b> {{ enc_text }} <br>
                            <b>Key:</b> {{ enc_key }} <br>
                            <b>Encrypted Text:</b> <span class="text-danger font-weight-bold">{{ enc_result }}</span>
                        </div>
                        {% endif %}
                    </form>
                </td>
            </tr>
            <tr><td style="font-weight: bold; color: blue">DECRYPTION</td></tr>
            <tr>
                <td>
                    <form method="POST" action="/vigenere_decrypt">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text" class="form-control" name="inputCipherText" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key (Text):</label>
                            <input type="text" class="form-control" name="inputKeyCipher" required/>
                        </div>
                        <button type="submit" class="btn btn-success">Decrypt</button>

                        {% if dec_result %}
                        <div class="alert alert-success mt-3">
                            <b>Text:</b> {{ dec_text }} <br>
                            <b>Key:</b> {{ dec_key }} <br>
                            <b>Decrypted Text:</b> <span class="text-danger font-weight-bold">{{ dec_result }}</span>
                        </div>
                        {% endif %}
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
